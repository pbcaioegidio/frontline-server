name: Client patch

# Tag: client-v202609.1.0  →  delta client-patch/ + FileList → Socket
# Fix: client-v202609.1.1  |  nova feature: client-v202609.2.0
on:
  push:
    tags:
      - "client-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "ClientVersion (ex. 202609.1.0 ou número). Vazio = YYYYMM.1.0 UTC."
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-upload:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RAW="${GITHUB_REF_NAME#client-v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            RAW="${{ inputs.version }}"
          else
            RAW="$(date -u +%Y%m).1.0"
          fi
          if [[ "$RAW" =~ ^([0-9]{6})\.([0-9]+)\.([0-9]+)$ ]]; then
            if (( ${BASH_REMATCH[2]} > 99 || ${BASH_REMATCH[3]} > 99 )); then
              echo "FEATURE/FIX no máximo 99"; exit 1
            fi
            VER="${BASH_REMATCH[1]}$(printf '%02d' "${BASH_REMATCH[2]}")$(printf '%02d' "${BASH_REMATCH[3]}")"
          else
            VER="$(echo "$RAW" | tr -cd '0-9')"
          fi
          if [[ -z "$VER" ]]; then echo "Versão inválida"; exit 1; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Client version: tag/raw=$RAW → socket=$VER"

      - name: Check client-patch has files
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "client-patch"
          $files = @(Get-ChildItem $root -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notin @("README.md", ".gitkeep") })
          if ($files.Count -eq 0) {
            throw "client-patch/ esta vazio. Coloque os arquivos do delta e tente de novo."
          }
          Write-Host "Delta files: $($files.Count)"
          $files | ForEach-Object { Write-Host " - $($_.FullName.Substring($root.Length + 1))" }

      - name: Fetch current UserFileList from VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          USER="${VPS_USER:-ubuntu}"
          ROOT="${VPS_PATH:-/opt/frontline/servidor}"
          mkdir -p ~/.ssh out/ufl-base
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          REMOTE="$USER@$VPS_HOST"
          # Prefer lista ja publicada no patch; senao tenta runtime do jogo (nao ha); senao falha se nao tiver
          if ssh "$REMOTE" "test -f '$ROOT/runtime/Socket/Data/Client/UserFileList.dat'"; then
            scp "$REMOTE:$ROOT/runtime/Socket/Data/Client/UserFileList.dat" out/ufl-base/UserFileList.dat
            scp "$REMOTE:$ROOT/runtime/Socket/Data/Client/UserFileList.sig" out/ufl-base/UserFileList.sig || true
          else
            echo "AVISO: UserFileList ainda nao esta no Socket. O job precisa de lista base."
            echo "Faca upload inicial uma vez (scp local UserFileList.dat para Data/Client) ou rode em self-hosted com client/."
            if [ -f client/UserFileList.dat ]; then
              cp client/UserFileList.dat out/ufl-base/UserFileList.dat
              cp client/UserFileList.sig out/ufl-base/UserFileList.sig 2>/dev/null || true
            else
              exit 1
            fi
          fi

      - name: Write FILELIST private PEM
        env:
          PEM: ${{ secrets.FILELIST_PRIVATE_PEM }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PEM)) {
            throw "Secret FILELIST_PRIVATE_PEM ausente"
          }
          New-Item -ItemType Directory -Force -Path "out" | Out-Null
          Set-Content -Path "out/filelist-private.pem" -Value $env:PEM.Trim() -Encoding ascii

      - name: Build patch (merge FileList + manifest)
        shell: pwsh
        run: |
          $clientRoot = ""
          if (Test-Path "client/FrontLine.exe") { $clientRoot = (Resolve-Path "client").Path }
          $args = @{
            Version          = "${{ steps.ver.outputs.version }}"
            PatchRoot        = (Resolve-Path "client-patch").Path
            ExistingFileList = (Resolve-Path "out/ufl-base/UserFileList.dat").Path
            PrivatePemPath   = (Resolve-Path "out/filelist-private.pem").Path
            OutDir           = (Join-Path $pwd "out/client-patch")
          }
          if ($clientRoot) { $args.ClientRoot = $clientRoot }
          & .\scripts\build-client-patch.ps1 @args

      - name: Upload patch to VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VER: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          USER="${VPS_USER:-ubuntu}"
          ROOT="${VPS_PATH:-/opt/frontline/servidor}"
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          REMOTE="$USER@$VPS_HOST"
          DEST="$ROOT/runtime/Socket/Data/Client"
          INFO="$ROOT/runtime/Socket/Info"
          CFG="$ROOT/runtime/Socket/Config/config.ini"

          ssh "$REMOTE" "mkdir -p '$DEST' '$INFO'"
          # Mantem arquivos antigos; sobrescreve so o delta (inclui UserFileList)
          scp -r out/client-patch/files/* "$REMOTE:$DEST/"
          scp out/client-patch/manifest.json "$REMOTE:$INFO/manifest.json"

          ssh "$REMOTE" "VER='$VER' CFG='$CFG' python3 - <<'PY'
          import os, re
          ver, cfg = os.environ['VER'], os.environ['CFG']
          text = open(cfg, 'r', encoding='utf-8', errors='replace').read()
          if re.search(r'(?m)^ClientVersion=', text):
              text = re.sub(r'(?m)^ClientVersion=.*$', 'ClientVersion=' + ver, text)
          else:
              text += '\nClientVersion=' + ver + '\n'
          open(cfg, 'w', encoding='utf-8').write(text)
          print('ClientVersion=', ver)
          PY"

          # Mesmo conjunto de composes usado pelo server-deploy (o socket roda em host network)
          ssh "$REMOTE" "cd '$ROOT' && C=(docker compose -f docker-compose.vps.yml); [ -f docker-compose.hostnet.yml ] && C+=(-f docker-compose.hostnet.yml); \"\${C[@]}\" restart socket"
          echo "OK client patch $VER"

      - name: Sync AccessUFL (Auth ServerConfig) com MD5 do patch
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          USER="${VPS_USER:-ubuntu}"
          ROOT="${VPS_PATH:-/opt/frontline/servidor}"
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          REMOTE="$USER@$VPS_HOST"
          # MD5 gerado no build (ufl-md5.txt) — fallback: hash do .dat no stage
          if [ -f out/client-patch/ufl-md5.txt ]; then
            UFL="$(tr -d '[:space:]' < out/client-patch/ufl-md5.txt | tr 'A-F' 'a-f')"
          else
            UFL="$(md5sum out/client-patch/files/UserFileList.dat | awk '{print tolower($1)}')"
          fi
          test -n "$UFL"
          echo "AccessUFL MD5=$UFL"
          ssh "$REMOTE" "export ROOT='$ROOT' UFL='$UFL'; bash -s" <<'REMOTE'
          set -euo pipefail
          python3 <<'PY'
          import os, re
          from pathlib import Path
          ufl = os.environ["UFL"].lower()
          p = Path(os.environ["ROOT"]) / "runtime/Data/ServerConfig.json"
          t = p.read_text(encoding="utf-8")
          t2, n = re.subn(
              r'("UserFileList"\s*:\s*")[^"]*(")',
              lambda m: m.group(1) + ufl + m.group(2),
              t,
              count=1,
          )
          if n != 1:
              raise SystemExit("UserFileList nao encontrado em ServerConfig.json")
          t2, n2 = re.subn(
              r'("AccessUFL"\s*:\s*")[^"]*(")',
              lambda m: m.group(1) + "true" + m.group(2),
              t2,
              count=1,
          )
          import json
          json.loads(t2)  # falha se JSON invalido
          p.write_text(t2, encoding="utf-8")
          print("ServerConfig UserFileList=", ufl, "AccessUFL n=", n2)
          PY
          REMOTE
          # Recarrega Auth/Game (jogadores conectados caem neste restart — necessario p/ AccessUFL)
          ssh "$REMOTE" "cd '$ROOT' && C=(docker compose -f docker-compose.vps.yml); [ -f docker-compose.hostnet.yml ] && C+=(-f docker-compose.hostnet.yml); \"\${C[@]}\" restart server"
          echo "OK AccessUFL sync"

      - name: Smoke — ClientVersion + manifest
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VER: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          USER="${VPS_USER:-ubuntu}"
          ROOT="${VPS_PATH:-/opt/frontline/servidor}"
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh "$USER@$VPS_HOST" "export ROOT='$ROOT' VER='$VER'; bash -s" <<'REMOTE'
          set -euo pipefail
          grep -E "^ClientVersion=$VER$" "$ROOT/runtime/Socket/Config/config.ini"
          test -f "$ROOT/runtime/Socket/Data/Client/UserFileList.dat"
          test -f "$ROOT/runtime/Socket/Info/manifest.json"
          python3 <<'PY'
          import json, re
          from pathlib import Path
          import os
          root = Path(os.environ["ROOT"])
          ver = os.environ["VER"]
          m = json.loads((root / "runtime/Socket/Info/manifest.json").read_text(encoding="utf-8"))
          assert m.get("clientVersion") == ver, m
          cfg = json.loads((root / "runtime/Data/ServerConfig.json").read_text(encoding="utf-8"))
          ufl = cfg["Server"][0]["UserFileList"].lower()
          socket_ufl = (root / "runtime/Socket/Data/Client/ufl-md5.txt").read_text(encoding="utf-8").strip().lower()
          assert ufl == socket_ufl, (ufl, socket_ufl)
          print("OK ver=%s files=%s AuthUFL=%s" % (ver, len(m.get("files") or []), ufl))
          PY
          REMOTE
