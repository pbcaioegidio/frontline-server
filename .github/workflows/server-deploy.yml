name: Server deploy

# Tag: server-v202609.1.0  →  sync servidor/ + docker compose rebuild na VPS
# Fix: server-v202609.1.1  |  nova feature: server-v202609.2.0
# Também: Actions → Run workflow (workflow_dispatch)
on:
  push:
    tags:
      - "server-v*"
  workflow_dispatch:
    inputs:
      rebuild_socket:
        description: "Também rebuild/restart do serviço socket"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag or date
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VER="${TAG#server-v}"
          else
            VER="$(date -u +%Y%m%d)"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Server deploy version: $VER"

      - name: Sync and rebuild on VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          REBUILD_SOCKET: ${{ inputs.rebuild_socket || false }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ] || [ -z "${VPS_HOST:-}" ]; then
            echo "Configure secrets VPS_SSH_KEY e VPS_HOST"
            exit 1
          fi
          USER="${VPS_USER:-ubuntu}"
          ROOT="${VPS_PATH:-/opt/frontline/servidor}"
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          REMOTE="$USER@$VPS_HOST"

          # Empacota só o necessário (sem bin/obj/.env)
          tar -C servidor -czf /tmp/servidor-src.tgz \
            --exclude='bin' --exclude='obj' --exclude='.env' \
            --exclude='**/bin' --exclude='**/obj' \
            --exclude='runtime' \
            --exclude='Unico.Execute/bin' \
            --exclude='Unico.Execute/obj' \
            .

          ssh "$REMOTE" "mkdir -p '$ROOT' && mkdir -p /tmp/fl-deploy"
          scp /tmp/servidor-src.tgz "$REMOTE:/tmp/fl-deploy/servidor-src.tgz"

          # Migration SQL (fora de servidor/)
          for mig in \
            database/migrations/migration_throw2_slot_unlock_20260912.sql \
            database/migrations/migration_portal_rewards_packed_20260913.sql \
            database/migrations/migration_event_portal_image_subtitle_20260728.sql \
            database/migrations/migration_event_portal_frontline_names_20260914.sql \
            database/migrations/migration_shop_box_emote_visible_20260915.sql \
            database/migrations/migration_shop_box_reward_variants_20260915.sql \
            database/migrations/migration_shop_box_safe_only_20260915.sql \
            database/migrations/migration_shop_box_one_safe_20260915.sql \
            database/migrations/migration_shop_box_pointup_odds_20260915.sql
          do
            if [ -f "$mig" ]; then
              scp "$mig" "$REMOTE:/tmp/fl-deploy/$(basename "$mig")"
            fi
          done

          # Seeds de eventos (Play/Login) — runtime não vem no tar
          if [ -d servidor/runtime-seed/Data/Events ]; then
            scp -r servidor/runtime-seed/Data/Events \
              "$REMOTE:/tmp/fl-deploy/events-seed"
          fi

          ssh "$REMOTE" bash -s <<EOF
          set -euo pipefail
          ROOT='$ROOT'
          cd "\$ROOT"
          # Remove o que o tar vai repor, senão arquivo apagado no git fica órfão
          # aqui e quebra o build (runtime/ e .env não vêm no tar, ficam intactos).
          for entry in \$(tar -tzf /tmp/fl-deploy/servidor-src.tgz | cut -d/ -f1 | sort -u); do
            case "\$entry" in
              ''|'.'|'..'|runtime|.env) continue ;;
            esac
            case "\$entry" in
              *[!A-Za-z0-9._-]*) continue ;;
            esac
            rm -rf "./\$entry"
          done
          tar -xzf /tmp/fl-deploy/servidor-src.tgz
          rm -f /tmp/fl-deploy/servidor-src.tgz
          if [ ! -f .env ]; then
            echo "Falta .env em \$ROOT (não sobe pelo Actions)"
            exit 1
          fi
          COMPOSE=(docker compose -f docker-compose.vps.yml)
          if [ -f docker-compose.hostnet.yml ]; then
            COMPOSE+=(-f docker-compose.hostnet.yml)
          fi
          COMPOSE+=(--env-file .env)

          apply_mig() {
            local f="\$1"
            local base
            base=\$(basename "\$f")
            if [ -f "\$f" ]; then
              echo "Aplicando \$base"
              docker cp "\$f" servidor-db-1:/tmp/"\$base"
              docker exec servidor-db-1 psql -U postgres -d pb -f /tmp/"\$base"
              rm -f "\$f"
            fi
          }
          apply_mig /tmp/fl-deploy/migration_throw2_slot_unlock_20260912.sql
          apply_mig /tmp/fl-deploy/migration_event_portal_image_subtitle_20260728.sql
          apply_mig /tmp/fl-deploy/migration_portal_rewards_packed_20260913.sql
          apply_mig /tmp/fl-deploy/migration_event_portal_frontline_names_20260914.sql
          apply_mig /tmp/fl-deploy/migration_shop_box_emote_visible_20260915.sql
          apply_mig /tmp/fl-deploy/migration_shop_box_reward_variants_20260915.sql
          apply_mig /tmp/fl-deploy/migration_shop_box_safe_only_20260915.sql
          apply_mig /tmp/fl-deploy/migration_shop_box_one_safe_20260915.sql
          apply_mig /tmp/fl-deploy/migration_shop_box_pointup_odds_20260915.sql
          apply_mig /tmp/fl-deploy/migration_shop_rollback_box_emote_20260915.sql

          if [ -d /tmp/fl-deploy/events-seed ]; then
            mkdir -p "\$ROOT/runtime/Data/Events"
            cp -f /tmp/fl-deploy/events-seed/Play.json "\$ROOT/runtime/Data/Events/Play.json" 2>/dev/null || true
            cp -f /tmp/fl-deploy/events-seed/Login.xml "\$ROOT/runtime/Data/Events/Login.xml" 2>/dev/null || true
            rm -rf /tmp/fl-deploy/events-seed
            echo "Events seed atualizado (Play.json / Login.xml)"
          fi

          "\${COMPOSE[@]}" up -d --build server
          if [ "$REBUILD_SOCKET" = "true" ]; then
            "\${COMPOSE[@]}" up -d --build socket
          fi
          "\${COMPOSE[@]}" ps
          echo "OK server deploy ${{ steps.ver.outputs.version }}"
          EOF

      - name: Smoke — Auth port listening
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          USER="${VPS_USER:-ubuntu}"
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh "$USER@$VPS_HOST" "sleep 8; ss -ltn | grep -E ':39190|:39191' || (docker logs --tail 40 servidor-server-1; exit 1)"
