name: Launcher release

# Tag: launcher-v202609.1.0  →  build FLLauncher + sobe para a VPS
# Fix: launcher-v202609.1.1  |  nova feature: launcher-v202609.2.0
# Socket usa long: 202609.1.0 → 2026090100
on:
  push:
    tags:
      - "launcher-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "LauncherVersion (ex. 202609.1.0 ou número). Vazio = YYYYMM.1.0 UTC."
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-upload:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Version from tag or input
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RAW="${GITHUB_REF_NAME#launcher-v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            RAW="${{ inputs.version }}"
          else
            RAW="$(date -u +%Y%m).1.0"
          fi
          # YYYYMM.FEATURE.FIX → YYYYMM + FEATURE(2d) + FIX(2d); legado = só dígitos
          if [[ "$RAW" =~ ^([0-9]{6})\.([0-9]+)\.([0-9]+)$ ]]; then
            if (( ${BASH_REMATCH[2]} > 99 || ${BASH_REMATCH[3]} > 99 )); then
              echo "FEATURE/FIX no máximo 99"; exit 1
            fi
            VER="${BASH_REMATCH[1]}$(printf '%02d' "${BASH_REMATCH[2]}")$(printf '%02d' "${BASH_REMATCH[3]}")"
          else
            VER="$(echo "$RAW" | tr -cd '0-9')"
          fi
          if [[ -z "$VER" ]]; then
            echo "Versão inválida (use vYYYYMM.FEATURE.FIX ou só dígitos)"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Launcher version: tag/raw=$RAW → socket=$VER"

      - name: Publish FLLauncher (self-contained win-x64)
        working-directory: launcher/Point Blank Launcher/Launcher.PointBlank
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "out/launcher"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          dotnet publish PointBlank.Launcher.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o $out
          Copy-Item -Force "Icon.ico" $out -ErrorAction SilentlyContinue
          $exe = Get-Item (Join-Path $out "FLLauncher.exe")
          Write-Host "FLLauncher.exe size=$($exe.Length) bytes"
          if ($exe.Length -lt 5MB) {
            throw "Publish parece framework-dependent demais ($($exe.Length) bytes). Esperado self-contained."
          }

      - name: Upload to VPS + bump LauncherVersion + manifest
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VER: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ] || [ -z "${VPS_HOST:-}" ]; then
            echo "Configure secrets VPS_SSH_KEY e VPS_HOST"
            exit 1
          fi
          USER="${VPS_USER:-ubuntu}"
          ROOT="${VPS_PATH:-/opt/frontline/servidor}"
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          REMOTE="$USER@$VPS_HOST"

          DEST_L="$ROOT/runtime/Socket/Data/Launcher"
          DEST_C="$ROOT/runtime/Socket/Data/Client"
          INFO="$ROOT/runtime/Socket/Info"
          CFG="$ROOT/runtime/Socket/Config/config.ini"

          # Update so dispara se local < server (long). Tag nova PRECISA ser maior
          # que a LauncherVersion atual — ex. apos 202609055, use 202609056 ou 202609070
          # (20260907 < 202609055 e o jogador NUNCA recebe o EXE novo).
          CUR=$(ssh "$REMOTE" "grep -E '^LauncherVersion=' '$CFG' 2>/dev/null | head -1 | cut -d= -f2 | tr -cd '0-9'" || true)
          CUR="${CUR:-0}"
          if [[ "$CUR" =~ ^[0-9]+$ ]] && [[ "$VER" =~ ^[0-9]+$ ]]; then
            if (( 10#$VER <= 10#$CUR )); then
              echo "::error::LauncherVersion nova ($VER) <= atual na VPS ($CUR)."
              echo "O Update compara long: tag menor → ninguem baixa o FLLauncher."
              echo "Use vYYYYMM.FEATURE.FIX com número maior (ex.: depois de 202609.1.0 → 202609.1.1 ou 202609.2.0)."
              exit 1
            fi
          fi
          echo "LauncherVersion VPS=$CUR → nova=$VER"

          ssh "$REMOTE" "mkdir -p '$DEST_L' '$DEST_C' '$INFO'"
          # Limpa launcher antigo no destino canônico e sobe o novo
          ssh "$REMOTE" "rm -rf '$DEST_L'/*"
          scp -r out/launcher/* "$REMOTE:$DEST_L/"
          # Update do jogador baixa de Data/Client — espelha FLLauncher.exe (+ deps se houver)
          scp out/launcher/FLLauncher.exe "$REMOTE:$DEST_C/FLLauncher.exe"
          if [ -f out/launcher/FLLauncher.pdb ]; then
            scp out/launcher/FLLauncher.pdb "$REMOTE:$DEST_C/FLLauncher.pdb" || true
          fi

          # MD5 do exe para o manifest (PowerShell no runner; hex no remote via md5sum)
          MD5=$(md5sum out/launcher/FLLauncher.exe | awk '{print toupper($1)}')
          SIZE=$(wc -c < out/launcher/FLLauncher.exe | tr -d ' \r\n')

          # Merge manifest: garante entrada FLLauncher.exe
          ssh "$REMOTE" "VER='$VER' MD5='$MD5' SIZE='$SIZE' CFG='$CFG' INFO='$INFO' python3 - <<'PY'
          import json, os, re
          ver = os.environ['VER']
          md5 = os.environ['MD5']
          size = int(os.environ['SIZE'])
          info = os.environ['INFO']
          cfg = os.environ['CFG']
          path = os.path.join(info, 'manifest.json')
          try:
              with open(path, 'r', encoding='utf-8') as f:
                  man = json.load(f)
          except Exception:
              man = {'clientVersion': ver, 'patchUrl': '', 'files': []}
          files = [x for x in man.get('files') or [] if (x.get('path') or '').replace('\\\\','/').lower() != 'fllauncher.exe']
          files.insert(0, {'path': 'FLLauncher.exe', 'zip': '', 'size': size, 'md5': md5})
          man['files'] = files
          # clientVersion do manifest acompanha patch de client; nao sobrescreve aqui
          if not man.get('clientVersion'):
              man['clientVersion'] = ver
          man['patchUrl'] = man.get('patchUrl') or ''
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(man, f, indent=2)
              f.write('\n')
          text = open(cfg, 'r', encoding='utf-8', errors='replace').read()
          if re.search(r'(?m)^LauncherVersion=', text):
              text = re.sub(r'(?m)^LauncherVersion=.*$', 'LauncherVersion=' + ver, text)
          else:
              text += '\nLauncherVersion=' + ver + '\n'
          open(cfg, 'w', encoding='utf-8').write(text)
          print('manifest + LauncherVersion=', ver)
          PY"

          # Mesmo conjunto de composes usado pelo server-deploy (o socket roda em host network)
          ssh "$REMOTE" "cd '$ROOT' && C=(docker compose -f docker-compose.vps.yml); [ -f docker-compose.hostnet.yml ] && C+=(-f docker-compose.hostnet.yml); \"\${C[@]}\" restart socket"
          echo "OK launcher $VER em $DEST_L e $DEST_C"

      - name: Baixa UserFileList da VPS
        id: ufl
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          PEM: ${{ secrets.FILELIST_PRIVATE_PEM }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PEM:-}" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "FILELIST_PRIVATE_PEM ausente — pulando sync FileList"
            exit 0
          fi
          if [ -z "${SSH_KEY:-}" ] || [ -z "${VPS_HOST:-}" ]; then
            echo "VPS_SSH_KEY / VPS_HOST obrigatorios"
            exit 1
          fi
          echo "skip=0" >> "$GITHUB_OUTPUT"
          USER="${VPS_USER:-ubuntu}"
          ROOT="${VPS_PATH:-/opt/frontline/servidor}"
          DEST_C="$ROOT/runtime/Socket/Data/Client"
          mkdir -p ~/.ssh out/ufl-base
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          scp "$USER@$VPS_HOST:$DEST_C/UserFileList.dat" out/ufl-base/UserFileList.dat
          scp "$USER@$VPS_HOST:$DEST_C/UserFileList.sig" out/ufl-base/UserFileList.sig || true
          printf '%s\n' "$PEM" > out/filelist-private.pem
          echo "UserFileList baixada"

      - name: Merge hash FLLauncher + assina FileList
        if: steps.ufl.outputs.skip != '1'
        env:
          VER: ${{ steps.ver.outputs.version }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/launcher-patch | Out-Null
          Copy-Item out/launcher/FLLauncher.exe out/launcher-patch/FLLauncher.exe -Force
          & .\scripts\build-client-patch.ps1 `
            -Version $env:VER `
            -PatchRoot (Resolve-Path out/launcher-patch).Path `
            -ExistingFileList (Resolve-Path out/ufl-base/UserFileList.dat).Path `
            -PrivatePemPath (Resolve-Path out/filelist-private.pem).Path `
            -OutDir (Join-Path $pwd "out/launcher-ufl")

      - name: Sobe FileList + atualiza manifest
        if: steps.ufl.outputs.skip != '1'
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VER: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          USER="${VPS_USER:-ubuntu}"
          ROOT="${VPS_PATH:-/opt/frontline/servidor}"
          DEST_C="$ROOT/runtime/Socket/Data/Client"
          INFO="$ROOT/runtime/Socket/Info"
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          REMOTE="$USER@$VPS_HOST"

          scp out/launcher-ufl/UserFileList.dat out/launcher-ufl/UserFileList.sig "$REMOTE:$DEST_C/"
          if [ -f out/launcher-ufl/files/ufl-md5.txt ]; then
            scp out/launcher-ufl/files/ufl-md5.txt "$REMOTE:$DEST_C/"
          elif [ -f out/launcher-ufl/ufl-md5.txt ]; then
            scp out/launcher-ufl/ufl-md5.txt "$REMOTE:$DEST_C/"
          fi

          MD5_DAT=$(md5sum out/launcher-ufl/UserFileList.dat | awk '{print toupper($1)}')
          MD5_SIG=$(md5sum out/launcher-ufl/UserFileList.sig | awk '{print toupper($1)}')
          SZ_DAT=$(wc -c < out/launcher-ufl/UserFileList.dat | tr -d ' \r\n')
          SZ_SIG=$(wc -c < out/launcher-ufl/UserFileList.sig | tr -d ' \r\n')

          ssh "$REMOTE" "MD5_DAT='$MD5_DAT' MD5_SIG='$MD5_SIG' SZ_DAT='$SZ_DAT' SZ_SIG='$SZ_SIG' INFO='$INFO' VER='$VER' python3 - <<'PY'
          import json, os
          info = os.environ['INFO']
          path = os.path.join(info, 'manifest.json')
          try:
              with open(path, encoding='utf-8') as f:
                  man = json.load(f)
          except Exception:
              man = {'clientVersion': os.environ['VER'], 'patchUrl': '', 'files': []}
          files = man.get('files') or []
          skip = {'userfilelist.dat', 'userfilelist.sig'}
          files = [x for x in files if (x.get('path') or '').replace('\\\\','/').lower() not in skip]
          files.append({'path': 'UserFileList.dat', 'zip': '', 'size': int(os.environ['SZ_DAT']), 'md5': os.environ['MD5_DAT']})
          files.append({'path': 'UserFileList.sig', 'zip': '', 'size': int(os.environ['SZ_SIG']), 'md5': os.environ['MD5_SIG']})
          man['files'] = files
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(man, f, indent=2)
              f.write('\n')
          print('manifest + UserFileList OK')
          PY"

          # Mesmo conjunto de composes usado pelo server-deploy (o socket roda em host network)
          ssh "$REMOTE" "cd '$ROOT' && C=(docker compose -f docker-compose.vps.yml); [ -f docker-compose.hostnet.yml ] && C+=(-f docker-compose.hostnet.yml); \"\${C[@]}\" restart socket"
          echo "FileList atualizada com hash do FLLauncher.exe"

      - name: Smoke — Socket up + LauncherVersion
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VER: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          USER="${VPS_USER:-ubuntu}"
          ROOT="${VPS_PATH:-/opt/frontline/servidor}"
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh "$USER@$VPS_HOST" "grep -E '^LauncherVersion=$VER' '$ROOT/runtime/Socket/Config/config.ini' && test -f '$ROOT/runtime/Socket/Data/Client/FLLauncher.exe' && ss -ltn | grep ':9000'"
          echo "Se o client (packs/config) tambem mudou, rode o workflow client-patch (tag client-v*)."
