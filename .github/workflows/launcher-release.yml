name: Launcher release

# Tag: launcher-v20260905  →  build FLLauncher self-contained + sobe para a VPS
# Copia para Data/Launcher (canônico) e Data/Client (FILE_REQ do Update) + manifest
on:
  push:
    tags:
      - "launcher-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "LauncherVersion (número, ex. 20260905). Vazio = data UTC."
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-upload:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Version from tag or input
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#launcher-v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VER="${{ inputs.version }}"
          else
            VER="$(date -u +%Y%m%d)"
          fi
          # só dígitos para comparação long no launcher
          VER="$(echo "$VER" | tr -cd '0-9')"
          if [[ -z "$VER" ]]; then
            echo "Versão inválida (precisa ser numérica)"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Launcher version: $VER"

      - name: Publish FLLauncher (self-contained win-x64)
        working-directory: launcher/Point Blank Launcher/Launcher.PointBlank
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "out/launcher"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          dotnet publish PointBlank.Launcher.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o $out
          Copy-Item -Force "Icon.ico" $out -ErrorAction SilentlyContinue
          $exe = Get-Item (Join-Path $out "FLLauncher.exe")
          Write-Host "FLLauncher.exe size=$($exe.Length) bytes"
          if ($exe.Length -lt 5MB) {
            throw "Publish parece framework-dependent demais ($($exe.Length) bytes). Esperado self-contained."
          }

      - name: Upload to VPS + bump LauncherVersion + manifest
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VER: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ] || [ -z "${VPS_HOST:-}" ]; then
            echo "Configure secrets VPS_SSH_KEY e VPS_HOST"
            exit 1
          fi
          USER="${VPS_USER:-ubuntu}"
          ROOT="${VPS_PATH:-/opt/frontline/servidor}"
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          REMOTE="$USER@$VPS_HOST"

          DEST_L="$ROOT/runtime/Socket/Data/Launcher"
          DEST_C="$ROOT/runtime/Socket/Data/Client"
          INFO="$ROOT/runtime/Socket/Info"
          CFG="$ROOT/runtime/Socket/Config/config.ini"

          ssh "$REMOTE" "mkdir -p '$DEST_L' '$DEST_C' '$INFO'"
          # Limpa launcher antigo no destino canônico e sobe o novo
          ssh "$REMOTE" "rm -rf '$DEST_L'/*"
          scp -r out/launcher/* "$REMOTE:$DEST_L/"
          # Update do jogador baixa de Data/Client — espelha FLLauncher.exe (+ deps se houver)
          scp out/launcher/FLLauncher.exe "$REMOTE:$DEST_C/FLLauncher.exe"
          if [ -f out/launcher/FLLauncher.pdb ]; then
            scp out/launcher/FLLauncher.pdb "$REMOTE:$DEST_C/FLLauncher.pdb" || true
          fi

          # MD5 do exe para o manifest (PowerShell no runner; hex no remote via md5sum)
          MD5=$(md5sum out/launcher/FLLauncher.exe | awk '{print toupper($1)}')
          SIZE=$(wc -c < out/launcher/FLLauncher.exe | tr -d ' \r\n')

          # Merge manifest: garante entrada FLLauncher.exe
          ssh "$REMOTE" "VER='$VER' MD5='$MD5' SIZE='$SIZE' CFG='$CFG' INFO='$INFO' python3 - <<'PY'
          import json, os, re
          ver = os.environ['VER']
          md5 = os.environ['MD5']
          size = int(os.environ['SIZE'])
          info = os.environ['INFO']
          cfg = os.environ['CFG']
          path = os.path.join(info, 'manifest.json')
          try:
              with open(path, 'r', encoding='utf-8') as f:
                  man = json.load(f)
          except Exception:
              man = {'clientVersion': ver, 'patchUrl': '', 'files': []}
          files = [x for x in man.get('files') or [] if (x.get('path') or '').replace('\\\\','/').lower() != 'fllauncher.exe']
          files.insert(0, {'path': 'FLLauncher.exe', 'zip': '', 'size': size, 'md5': md5})
          man['files'] = files
          # clientVersion do manifest acompanha patch de client; nao sobrescreve aqui
          if not man.get('clientVersion'):
              man['clientVersion'] = ver
          man['patchUrl'] = man.get('patchUrl') or ''
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(man, f, indent=2)
              f.write('\n')
          text = open(cfg, 'r', encoding='utf-8', errors='replace').read()
          if re.search(r'(?m)^LauncherVersion=', text):
              text = re.sub(r'(?m)^LauncherVersion=.*$', 'LauncherVersion=' + ver, text)
          else:
              text += '\nLauncherVersion=' + ver + '\n'
          open(cfg, 'w', encoding='utf-8').write(text)
          print('manifest + LauncherVersion=', ver)
          PY"

          ssh "$REMOTE" "cd '$ROOT' && docker compose -f docker-compose.vps.yml restart socket"
          echo "OK launcher $VER em $DEST_L e $DEST_C"

      - name: Atualiza UserFileList (hash do FLLauncher.exe)
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          PEM: ${{ secrets.FILELIST_PRIVATE_PEM }}
          VER: ${{ steps.ver.outputs.version }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PEM)) {
            Write-Warning "FILELIST_PRIVATE_PEM ausente — FL Guard pode marcar FLLauncher.exe como alterado apos Update. Configure o secret."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:SSH_KEY) -or [string]::IsNullOrWhiteSpace($env:VPS_HOST)) {
            throw "VPS_SSH_KEY / VPS_HOST obrigatorios para atualizar FileList"
          }
          $user = if ($env:VPS_USER) { $env:VPS_USER } else { "ubuntu" }
          $root = if ($env:VPS_PATH) { $env:VPS_PATH } else { "/opt/frontline/servidor" }
          $remote = "${user}@$($env:VPS_HOST)"
          $destC = "$root/runtime/Socket/Data/Client"
          $key = Join-Path $env:TEMP "fl-launcher-release-key"
          Set-Content -Path $key -Value $env:SSH_KEY.Trim() -Encoding ascii -NoNewline
          # OpenSSH no Windows exige ACL restrita na chave
          icacls $key /inheritance:r | Out-Null
          icacls $key /grant:r "$($env:USERNAME):(R)" | Out-Null

          New-Item -ItemType Directory -Force -Path out/ufl-base, out/launcher-patch | Out-Null
          scp -i $key -o StrictHostKeyChecking=accept-new `
            "${remote}:${destC}/UserFileList.dat" out/ufl-base/UserFileList.dat
          scp -i $key "${remote}:${destC}/UserFileList.sig" out/ufl-base/UserFileList.sig 2>$null

          Copy-Item out/launcher/FLLauncher.exe out/launcher-patch/FLLauncher.exe -Force
          Set-Content -Path out/filelist-private.pem -Value $env:PEM.Trim() -Encoding ascii

          & .\scripts\build-client-patch.ps1 `
            -Version $env:VER `
            -PatchRoot (Resolve-Path out/launcher-patch).Path `
            -ExistingFileList (Resolve-Path out/ufl-base/UserFileList.dat).Path `
            -PrivatePemPath (Resolve-Path out/filelist-private.pem).Path `
            -OutDir (Join-Path $pwd "out/launcher-ufl")

          scp -i $key `
            out/launcher-ufl/UserFileList.dat `
            out/launcher-ufl/UserFileList.sig `
            out/launcher-ufl/files/ufl-md5.txt `
            "${remote}:${destC}/"

          # Garante que o Update baixe tambem a FileList nova (merge no manifest)
          $md5Dat = (Get-FileHash out/launcher-ufl/UserFileList.dat -Algorithm MD5).Hash
          $md5Sig = (Get-FileHash out/launcher-ufl/UserFileList.sig -Algorithm MD5).Hash
          $szDat = (Get-Item out/launcher-ufl/UserFileList.dat).Length
          $szSig = (Get-Item out/launcher-ufl/UserFileList.sig).Length
          $info = "$root/runtime/Socket/Info"
          ssh -i $key $remote "python3 - <<'PY'
          import json, os
          path = os.path.join('$info', 'manifest.json')
          try:
              man = json.load(open(path, encoding='utf-8'))
          except Exception:
              man = {'clientVersion': '$env:VER', 'patchUrl': '', 'files': []}
          files = man.get('files') or []
          def drop(name):
              return [x for x in files if (x.get('path') or '').replace('\\\\','/').lower() != name.lower()]
          files = drop('UserFileList.dat')
          files = drop('UserFileList.sig')
          files.append({'path': 'UserFileList.dat', 'zip': '', 'size': $szDat, 'md5': '$md5Dat'})
          files.append({'path': 'UserFileList.sig', 'zip': '', 'size': $szSig, 'md5': '$md5Sig'})
          man['files'] = files
          json.dump(man, open(path, 'w', encoding='utf-8'), indent=2)
          print('manifest + UserFileList entries OK')
          PY"
          ssh -i $key $remote "cd '$root' && docker compose -f docker-compose.vps.yml restart socket"
          Write-Host "FileList atualizada com hash do FLLauncher.exe"

      - name: Smoke — Socket up + LauncherVersion
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VER: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          USER="${VPS_USER:-ubuntu}"
          ROOT="${VPS_PATH:-/opt/frontline/servidor}"
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh "$USER@$VPS_HOST" "grep -E '^LauncherVersion=$VER' '$ROOT/runtime/Socket/Config/config.ini' && test -f '$ROOT/runtime/Socket/Data/Client/FLLauncher.exe' && ss -ltn | grep ':9000'"
          echo "Se o client (packs/config) tambem mudou, rode o workflow client-patch (tag client-v*)."
