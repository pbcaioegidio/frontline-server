name: Installer release

# Tag installer-v* OU Actions → Run workflow
# Gera o .exe Inno e publica em GitHub Releases (download fácil).
# Opcional: espelho em /var/frontline/downloads na VPS.
#
# Requisito: pasta client/ no runner (self-hosted Windows) —
# no windows-latest do GitHub o client não está no git (muito grande).
# Alternativa local: .\scripts\pack-player-setup.ps1 -Mode Slim -GitHubRelease

on:
  push:
    tags:
      - "installer-v*"
  workflow_dispatch:
    inputs:
      mode:
        description: "Slim (sem Pack) ou Full"
        type: choice
        options: [Slim, Full]
        default: Slim
      version:
        description: "Versão do setup (vazia = data UTC)"
        required: false
        type: string
      mirror_vps:
        description: "Também copiar para VPS /var/frontline/downloads"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  pack-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require client/
        shell: pwsh
        run: |
          if (-not (Test-Path "client/FLLauncher.exe") -or -not (Test-Path "client/FrontLine.exe")) {
            Write-Host "::error::Pasta client/ ausente neste runner."
            Write-Host "O instalador precisa do client completo (nao vai no git)."
            Write-Host "Opcoes:"
            Write-Host "  1) Na maquina de build: .\\scripts\\pack-player-setup.ps1 -Mode Slim -GitHubRelease"
            Write-Host "  2) Runner self-hosted Windows com client/ ao lado do clone + Run workflow / tag installer-v*"
            exit 1
          }
          Write-Host "client/ OK"

      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#installer-v}"
            TAG="$GITHUB_REF_NAME"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VER="${{ inputs.version }}"
            TAG="installer-v${VER}"
          else
            VER="$(date -u +%Y%m%d)"
            TAG="installer-v${VER}"
          fi
          VER="$(echo "$VER" | tr -cd '0-9.')"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "mode=${{ inputs.mode || 'Slim' }}" >> "$GITHUB_OUTPUT"
          echo "Installer $TAG mode=${{ inputs.mode || 'Slim' }}"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup -e --accept-package-agreements --accept-source-agreements
          $iscc = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe nao encontrado apos install" }
          echo "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Pack installer
        shell: pwsh
        run: |
          & .\scripts\pack-player-setup.ps1 `
            -Mode "${{ steps.ver.outputs.mode }}" `
            -Version "${{ steps.ver.outputs.version }}" `
            -ClientRoot (Resolve-Path "client").Path `
            -OutDir (Join-Path $pwd "dist")
          Get-ChildItem dist\Instalador-FrontLine-*.exe | ForEach-Object {
            Write-Host "Built $($_.Name) ($([math]::Round($_.Length/1MB,1)) MB)"
          }

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          VER="${{ steps.ver.outputs.version }}"
          MODE="${{ steps.ver.outputs.mode }}"
          EXE=$(ls -1 dist/Instalador-FrontLine-*.exe | head -1)
          BODY=$(cat <<EOF
          ## Instalador FrontLine ($MODE)

          Versão do setup: **$VER**

          1. Baixe o \`.exe\` abaixo
          2. Instale (UAC / administrador — só nesta instalação)
          3. Abra o **FrontLine** pelo atalho
          4. Atualizações futuras: botão **Update** no FLLauncher (não precisa baixar o instalador de novo)

          Slim = sem pasta Pack (menor; packs baixam no Update se necessário).
          Full = client completo no instalador.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$EXE" --clobber
            gh release edit "$TAG" --notes "$BODY"
          else
            gh release create "$TAG" "$EXE" \
              --title "Instalador FrontLine $VER ($MODE)" \
              --notes "$BODY"
          fi
          echo "Download: https://github.com/${{ github.repository }}/releases/tag/$TAG"

      - name: Mirror VPS (opcional)
        if: ${{ github.event_name == 'push' || inputs.mirror_vps }}
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ] || [ -z "${VPS_HOST:-}" ]; then
            echo "Sem VPS_SSH_KEY/VPS_HOST — pulando espelho VPS (Release no GitHub ja esta OK)."
            exit 0
          fi
          USER="${VPS_USER:-ubuntu}"
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          REMOTE="$USER@$VPS_HOST"
          DEST="/var/frontline/downloads"
          ssh "$REMOTE" "sudo mkdir -p '$DEST' && sudo chown \$USER:\$USER '$DEST'"
          EXE=$(ls -1 dist/Instalador-FrontLine-*.exe | head -1)
          BASE=$(basename "$EXE")
          scp "$EXE" "$REMOTE:$DEST/"
          ssh "$REMOTE" "cd '$DEST' && ln -sfn '$BASE' FrontLine-Setup-latest.exe && ls -lh | tail -5"
          echo "Espelho VPS OK: $DEST/$BASE"
