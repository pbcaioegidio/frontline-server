# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name frontlinebattle.com.br www.frontlinebattle.com.br;
    return 301 https://www.frontlinebattle.com.br$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name frontlinebattle.com.br www.frontlinebattle.com.br;

    ssl_certificate /etc/letsencrypt/live/www.frontlinebattle.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.frontlinebattle.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($host = frontlinebattle.com.br) {
        return 301 https://www.frontlinebattle.com.br$request_uri;
    }

    root /var/www/frontlinebattle;
    index index.html;

    client_max_body_size 0;
    sendfile on;
    tcp_nopush on;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /downloads/ {
        alias /var/frontline/downloads/;
        autoindex off;
        sendfile on;
        tcp_nopush on;
        types {
            application/octet-stream exe bin;
            application/zip zip;
        }
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        send_timeout 7200s;
        keepalive_timeout 75s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
