[Server]
Host=0.0.0.0
Port=9000

[Launcher]
LauncherVersion=202605
ClientVersion=20260514
Maintenance=false
MaintenanceMessage=Servidor em manutenção.

[Patch]
ManifestPath=Info\manifest.json
ManifestUrl=http://127.0.0.1/patch/manifest.json
ClientFilesPath=Data\Client
LauncherFilesPath=Data\Launcher

[Security]
MaxPacketSize=50331648
EnablePacketLog=true
; FL GUARD
TosVersion=6
; Validade do token OTP em minutos
TokenMinutes=10
; Recusar login sem fingerprint (ligar quando todos usarem o launcher novo)
RequireFingerprint=true
; Score de evasao: >= AutoBan bane a conta nova; >= Suspect so marca
EvasionAutoBanScore=4
EvasionSuspectScore=2
; Brute force por IP
BruteForceMaxFailures=5
BruteForceWindowMinutes=5
BruteForceBlockMinutes=15
; Pasta de evidências na VPS (vazio = ./Evidence). Ou env FL_EVIDENCE_ROOT
EvidenceRoot=

[Database]
Host=127.0.0.1
Port=5433
Name=pb
User=postgres
Pass=postgres
