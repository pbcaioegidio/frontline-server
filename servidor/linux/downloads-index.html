<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FrontLine — Download</title>
  <style>
    :root { --bg:#0e1419; --card:#1a232c; --text:#e8eef2; --muted:#8fa3b0; --accent:#3d9ecd; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Segoe UI, system-ui, sans-serif; background: radial-gradient(1200px 600px at 50% -10%, #1c3a4a, var(--bg)); color: var(--text); min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 24px; }
    .card { background: var(--card); border: 1px solid #2a3844; border-radius: 16px; padding: 36px 32px; max-width: 440px; width: 100%; text-align: center; }
    h1 { margin: 0 0 8px; font-size: 1.75rem; letter-spacing: 0.04em; }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 24px; }
    a.btn { display:inline-block; background: var(--accent); color: #041018; font-weight: 700; text-decoration: none; padding: 14px 22px; border-radius: 10px; }
    a.btn:hover { filter: brightness(1.08); }
    .note { margin-top: 20px; font-size: 0.85rem; color: var(--muted); }
    code { color: #c5e4f5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>FRONTLINE</h1>
    <p>Baixe o setup, extraia a pasta e abra <strong>FLLauncher.exe</strong>. Atualizações depois entram pelo próprio launcher (Socket).</p>
    <a class="btn" href="/downloads/FrontLine-Setup-latest.tar.gz">Baixar setup</a>
    <p class="note">Formato <code>.tar.gz</code> — no Windows 11: botão direito → Extrair, ou 7-Zip.</p>
  </div>
</body>
</html>
